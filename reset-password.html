<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="alert.css" />
    <script src="alert.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | MicHost</title>
    <link rel="stylesheet" href="login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
    <div class="background">
        <span class="blood b1"></span>
        <span class="blood b2"></span>
        <span class="blood b3"></span>
        <span class="blood b4"></span>
        <span class="blood b5"></span>
        <span class="blood b6"></span>

        <div class="card">
            <div class="back-btn" onclick="window.location.href='login.html'">
                <i class="fa-solid fa-chevron-left"></i>
            </div>

            <div class="logo">
                <svg width="70" height="70" viewBox="0 0 512 512">
                    <path fill="#D71920" d="M256 32C256 32 96 208 96 320c0 88.4 71.6 160 160 160s160-71.6 160-160C416 208 256 32 256 32z"/>
                    <circle cx="256" cy="330" r="65" fill="#fff"/>
                    <path fill="#D71920" d="M255 270c-34 0-61 27-61 60s27 60 61 60 61-27 61-60-27-60-61-60zm0 95a35 35 0 1 1 0-70 35 35 0 0 1 0 70z"/>
                    <circle cx="256" cy="330" r="18" fill="#D71920"/>
                </svg>
            </div>

            <h1>Reset Password</h1>
            <p>Create a new password for your account.</p>

            <form id="resetPasswordForm">
                <input type="hidden" id="token" name="token" />

                <label>New Password</label>
                <div class="input-box password">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" name="password" type="password" placeholder="Create new password" required />
                    <i class="fa-regular fa-eye togglePassword"></i>
                </div>

                <label>Confirm Password</label>
                <div class="input-box password">
                    <i class="fa-solid fa-lock"></i>
                    <input id="confirmPassword" name="confirm_password" type="password" placeholder="Confirm new password" required />
                    <i class="fa-regular fa-eye toggleConfirm"></i>
                </div>

                <button class="login-btn" type="submit">
                    Update Password
                    <span><i class="fa-solid fa-arrow-right"></i></span>
                </button>
            </form>

            <div class="signup" style="margin-top: 1rem;">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const tokenInput = document.getElementById('token');
        if (tokenInput) tokenInput.value = token;

        function attachToggle(buttonSelector, inputSelector) {
            const toggle = document.querySelector(buttonSelector);
            const input = document.getElementById(inputSelector);
            if (!toggle || !input) return;

            toggle.addEventListener('click', () => {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggle.classList.toggle('fa-eye');
                toggle.classList.toggle('fa-eye-slash');
            });
        }

        attachToggle('.togglePassword', 'password');
        attachToggle('.toggleConfirm', 'confirmPassword');

        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const isFileUrl = window.location.protocol === 'file:';
        const apiBase = window.location.port === '5500'
            ? `${window.location.protocol}//${window.location.hostname}:8000`
            : '';

        if (resetPasswordForm) {
            resetPasswordForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const formData = new FormData(resetPasswordForm);
                const password = (formData.get('password') || '').toString();
                const confirm = (formData.get('confirm_password') || '').toString();
                const enteredToken = (formData.get('token') || '').toString();

                if (!enteredToken) {
                    alert('Reset token is missing. Please request a new password reset link.');
                    return;
                }

                if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
                    alert('Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character.');
                    return;
                }

                if (password !== confirm) {
                    alert('Passwords do not match.');
                    return;
                }

                try {
                    if (isFileUrl) {
                        throw new Error('Open this page through the PHP server, for example http://localhost:8000/reset-password.html?token=...');
                    }

                    const response = await fetch(`${apiBase}/php/auth/reset-password.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                        body: new URLSearchParams({ token: enteredToken, password, confirm_password: confirm }),
                        credentials: 'include'
                    });

                    const data = await response.json();
                    if (!data.success) {
                        throw new Error(data.message || 'Unable to reset password.');
                    }

                    alert(data.message || 'Password reset successfully.');
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Reset password error:', error);
                    alert(error.message || 'Unable to reset password right now.');
                }
            });
        }
    </script>
</body>
</html>

<script>
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");
const overlay = document.getElementById("overlay");

menuBtn.addEventListener("click", () => {
    sidebar.classList.add("active");
    overlay.classList.add("active");
});

closeBtn.addEventListener("click", () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
});

overlay.addEventListener("click", () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
});


/* NOTIFICATIONS */

const notifications = document.getElementById("notifications");
const emailNotifications = document.getElementById("emailNotifications");

    async function updateSetting(key, value, checkbox) {
        try {
            const response = await fetch('php/profile/update-settings.php', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ [key]: value })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Unable to save setting');
            }
        } catch (err) {
            console.error('Unable to save setting', err);
            if (checkbox) checkbox.checked = !checkbox.checked;
            alert(err.message || 'Unable to save setting');
        }
    }

async function loadSettings() {
    try {
        const response = await fetch('php/profile/update-settings.php', {
            credentials: 'include'
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Unable to load settings');
        }

        notifications.checked = data.settings.notifications === 'enabled';
        emailNotifications.checked = data.settings.emailNotifications === 'enabled';
        return;
    } catch (err) {
        console.warn('Unable to load saved settings:', err);
    }

    // Use local values only when the backend cannot be reached.
    notifications.checked = localStorage.getItem('notifications') === 'enabled';
    emailNotifications.checked = localStorage.getItem('emailNotifications') === 'enabled';
}

loadSettings();

notifications.addEventListener('change', function () {
    const value = this.checked ? 'enabled' : 'disabled';
    localStorage.setItem('notifications', value);
    updateSetting('notifications', value, this);
});

emailNotifications.addEventListener('change', function () {
    const value = this.checked ? 'enabled' : 'disabled';
    localStorage.setItem('emailNotifications', value);
    updateSetting('emailNotifications', value, this);
});

    const current =
    document.getElementById("currentPassword").value;

    const newPassword =
    document.getElementById("newPassword").value;

    const confirm =
    document.getElementById("confirmPassword").value;

    if (
        current === "" ||
        newPassword === "" ||
        confirm === ""
    ) {

        alert("Please fill in all password fields.");

        return;

    }

    if (newPassword !== confirm) {

        alert("New passwords do not match.");

        return;

    }

    // Call backend to change password
    fetch('php/auth/change-password.php', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: current, new_password: newPassword })
    })
    .then(res => res.json())
    .then(data => {
        if (data && data.success) {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            alert('Password changed successfully.');
        } else {
            alert(data.message || 'Unable to change password.');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Network error while changing password.');
    });

});


</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="alert.css" />
    <script src="alert.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | MicHost</title>
    <link rel="stylesheet" href="login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>
<body>
    <div class="background">
        <span class="blood b1"></span>
        <span class="blood b2"></span>
        <span class="blood b3"></span>
        <span class="blood b4"></span>
        <span class="blood b5"></span>
        <span class="blood b6"></span>

        <div class="card">
            <div class="back-btn" onclick="window.history.back()">
                <i class="fa-solid fa-chevron-left"></i>
            </div>

            <div class="logo">
                <svg width="70" height="70" viewBox="0 0 512 512">
                    <path fill="#D71920" d="M256 32C256 32 96 208 96 320c0 88.4 71.6 160 160 160s160-71.6 160-160C416 208 256 32 256 32z"/>
                    <circle cx="256" cy="330" r="65" fill="#fff"/>
                    <path fill="#D71920" d="M255 270c-34 0-61 27-61 60s27 60 61 60 61-27 61-60-27-60-61-60zm0 95a35 35 0 1 1 0-70 35 35 0 0 1 0 70z"/>
                    <circle cx="256" cy="330" r="18" fill="#D71920"/>
                </svg>
            </div>

            <h1>Forgot Password</h1>
            <p>Enter your email and we’ll generate a reset link.</p>

            <form id="forgotPasswordForm">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input id="email" name="email" type="email" placeholder="Enter your email" required />
                </div>

                <button class="login-btn lower-btn" type="submit">
                    Send Reset Link
                    <span><i class="fa-solid fa-arrow-right"></i></span>
                </button>
            </form>

            <div class="signup" style="margin-top: 1rem;">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const isFileUrl = window.location.protocol === 'file:';
        const apiBase = window.location.port === '5500'
            ? `${window.location.protocol}//${window.location.hostname}:8000`
            : '';

        if (forgotPasswordForm) {
            forgotPasswordForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const formData = new FormData(forgotPasswordForm);
                const email = (formData.get('email') || '').toString().trim();

                if (!email) {
                    alert('Please enter your email address.');
                    return;
                }

                try {
                    if (isFileUrl) {
                        throw new Error('Open this page through the PHP server, for example http://localhost:8000/forgot-password.html.');
                    }

                    const response = await fetch(`${apiBase}/php/auth/forgot-password.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
                        body: new URLSearchParams({ email }),
                        credentials: 'include'
                    });

                    const data = await response.json();
                    if (!data.success) {
                        throw new Error(data.message || 'Unable to process password reset.');
                    }

                    const resetUrl = data.reset_url || `${location.origin}/reset-password.html?token=${encodeURIComponent(data.token || '')}`;
                    alert(data.message || 'Reset link ready.');
                    document.getElementById('email').value = '';

                    const shouldContinue = confirm(`Your password reset link is ready.\n\n${resetUrl}\n\nOpen it now?`);
                    if (shouldContinue && resetUrl) {
                        window.location.href = resetUrl;
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    alert(error.message || 'Unable to process password reset right now.');
                }
            });
        }
    </script>
</body>
</html>
